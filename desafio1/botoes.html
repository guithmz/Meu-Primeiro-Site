<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botoes</title>
</head>
<style>
    button {
        background: lightgray border-radius: 5px;
        whidth: 100px;
    }

    .botoes-de-classe {
        background: blue;
        border-radius: 5px;
        width: 100px;



    }


    #botao-id {
        background: green;
        border-radius: 5px;
        width: 100px;
    }

    button[style] {
        background: yellow;
        border-radius: 5px;
        width: 100px;
    }


    div p {
        color: red;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 30px;
        border-radius: 8px;
        background: lightgray;
    

    }


    h2~p {
        color: orange;
    }


    h2+p {
        color: green;
    }
</style>

<body>
    <button>Elemento</button>
    <button class="botoes-de-classe">Salvar</button>
    <button id="botao-id">Enviar</button>
    <button style="background:red;">Deletar</button>
    <div>
        <h2>Titulo</h2>
        <p>Primeiro</p>
        <p>Segundo</p>
        <section>
            <p>Interno</p>
        </section>

    </div>

</body>

</html>
