<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: .6rem;
            text-align: left;
        }

        thead {
            background: #eaf2f8;
        }

        caption {
            font-weight: bold;
            margin-bottom: .5rem;
        }
    </style>


</head>

<body style="background-color: rgb(143, 177, 187);">

    <h1 style="text-align: center;">Formulário de Contato</h1>

    <body>

        <form action="https://google.com" method="get">
            <label for="busca">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required><br>
            <label for="genero">Gênero:</label>
            <input type="radio" id="masculino" name="genero" value="masculino" required>
            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="genero" value="feminino" required>
            <label for="feminino">Feminino</label><br>
            <label for="nascimento">Data de Nascimento:</label>

            <input type="date" id="nascimento" name="nascimento" required><br>
            <label for="idade">Idade:</label>
            <input id="idade" name="idade" type="number" min="18" max="120" required><br>

            <label for="datatime">Data e Hora:</label>
            <input type="datetime-local" id="datatime" name="datatime" required><br>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required><br>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" required placeholder="Digite seu endereço"><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="50" required></textarea><br>
            <button type="submit">Enviar</button>
            <input type="reset" value="Limpar">
            <label for="termos">Aceito os termos e condições:</label>
            <input type="checkbox" id="termos" name="termos" required><br>
            <label for="curso">Curso:</label>
            <select id="curso" name="curso" required>
                <option value="">Selecione um curso</option>
                <option value="informatica">Informática</option>
                <option value="Matematica">Matemática</option>
                <option value="programaçao">Programação</option>
                <option value="desenho">Desenho</option>
            </select><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="50" required></textarea><br>

            <button type="submit">Enviar</button>
            <input type="reset" value="Limpar">



        </form>


        <table>
            <caption>Horarios de atendimento</caption>
            <thead>
                <tr>
                    <th scope="col">Dia da Semana</th>
                    <th scope="col">Horário de Atendimento</th>
                </tr>

            </thead>
            <tbody>
                <tr>
                    <th scope="row">Segunda-feira</th>
                    <td>08:00 - 12:00</td>
                </tr>
                <tr>
                    <th scope="row">Terça-feira</th>
                    <td>13:00 - 17:00</td>
                </tr>
            </tbody>
        </table>
        </table>


    </body>

</html>
