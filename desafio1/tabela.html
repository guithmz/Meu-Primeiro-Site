<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            background-image: url('windows.jpg');
            background-size: cover;

            background-position: center;

            background-attachment: fixed;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: .6rem;
            text-align: left;
        }

        thead {
            background: #eaf2f8;

        }

        caption {
            font-weight: bold;
            margin-bottom: .5rem;
        }
    </style>


</head>

<table>
    <caption>Horários de atendimento</caption>
    <thead>
        <tr>
            <th scope="col">Dia</th>
            <th scope="col">Horário</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row">Segunda</th>
            <td>8h–12h</td>
        </tr>
        <tr>
            <th scope="row">Terça</th>
            <td>13h–17h</td>
        </tr>
    </tbody>
</table>

<body>

</body>

</html>
