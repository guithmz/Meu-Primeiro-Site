<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

.container {
            display: flex;
            flex-direction: row;
            
        
        }

        .card {
            position: relative;
            background-color: rgb(63, 213, 240);
            width: 320px;
            height: 420px;
            border: 2px solid black;
            border-radius: 8px;
            padding: 24px;
            margin: 16px;
            
        }

        h1 {
            text-align: center;
            color: white;
            
        }

        .card-botao {
            position: absolute; 
            bottom: 15px;
            right: 20px;
            display: inline-block;
            background-color: white;
            color: black;
            border: 1px solid green;
            border-radius: 8px;
            padding: 15px;
            

            
            




        }
    </style>


</head>


<body>
    <section class="card">

        <h1 class="card-titulo">Card de Produto</h1>
        <p class="card-descricao">Aplique o Box Model na prática construindo este componente</p>

        <button class="card-botao">Comprar</button>


    </section>




</body>

</html>
